[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-sgd-from-scratch"
version = "0.1.0"
description = "DP-SGD from scratch: Poisson sampling, per-example clipping with torch.func, RDP and privacy-loss-distribution accountants (certified upper and lower bounds), and an empirical privacy audit that catches a noise-scaling bug."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.6", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"src/dpsgd/bench.py" = ["E501"]  # markdown table rows
